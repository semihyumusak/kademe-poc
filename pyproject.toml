[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kademe-poc"
version = "0.1.0"
description = "KADEME PoC: yükseköğretim mevzuatı için hiyerarşi ve sürüm farkında graf temelli erişim (ön çalışma, araştırma prototipi)"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Semih Yumuşak" }]
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "lxml>=4.9",
  "python-docx>=1.1",
  "networkx>=3.1",
  "numpy>=1.26",
  "rank-bm25>=0.2.2",
  "rdflib>=7.0",
]

[project.optional-dependencies]
dense = ["sentence-transformers>=3.0", "torch>=2.2"]
dev = ["pytest>=8"]

[project.scripts]
kademe = "kademe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
